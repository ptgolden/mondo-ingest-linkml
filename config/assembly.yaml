# Which ROBOT query result (in --query-dir) fills which part of a SourceRelease.
# Column names in each CSV are slot names from the schema; the assembler uses
# the schema to decide what is multivalued, inlined, boolean, or a CURIE.
metadata: metadata.csv
terms: terms.csv
term_slots:
  definition: definitions.csv
  synonyms: synonyms.csv
  parents: parents.csv
  relationships: relationships.csv
  replaced_by: replacement.csv
  consider: consider.csv
  subsets: subsets.csv
  mappings: mappings.csv

# Sort order for lists of objects, so that a change to one item shows up as a
# local edit in a diff, not a move. Unlisted slots sort by full content.
sort_by:
  mappings: [object_id, predicate_id]
