# Canonical prefix map: every CURIE in a release must use one of these.
#
# EXPERIMENT: like the schema, this would live once in mondo-ingest, not per source
# repo. For now it follows mondo-ingest's own conventions for ORDO: the bases in its
# src/ontology/metadata/ordo.metadata.sssom.yml, plus MONDO and icd11.foundation as
# they appear in its released mappings/ordo.sssom.tsv (v2026-01-24).
#
# Orphanet's own prefix spellings ("ICD-10", "MeSH", ...) are rewritten to these
# in sparql/mappings.rq.

# Vocabulary
oboInOwl: http://www.geneontology.org/formats/oboInOwl#
skos: http://www.w3.org/2004/02/skos/core#
semapv: https://w3id.org/semapv/vocab/
mondo: http://purl.obolibrary.org/obo/mondo#
RO: http://purl.obolibrary.org/obo/RO_
orcid: https://orcid.org/

# Terms and mapping targets
Orphanet: http://www.orpha.net/ORDO/Orphanet_
MONDO: http://purl.obolibrary.org/obo/MONDO_
OMIM: https://omim.org/entry/
ICD10: http://apps.who.int/classifications/icd10/browse/2010/en#/
# NOTE: ORDO's ICD-11 codes are MMS codes (e.g. LD28.01), not Foundation IDs, but
# mondo-ingest files them under icd11.foundation. Kept for compatibility.
icd11.foundation: http://id.who.int/icd/entity/
MESH: http://identifiers.org/mesh/
UMLS: http://linkedlifedata.com/resource/umls/id/
MedDRA: https://identifiers.org/meddra/

# Gene-disease relation targets
HGNC: http://identifiers.org/hgnc/
