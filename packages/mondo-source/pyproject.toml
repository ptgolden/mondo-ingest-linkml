[project]
name = "mondo-source"
version = "0.1.0"
description = "Shared tooling for Mondo source ingests: the LinkML schema, SPARQL extraction, SSSOM and OWL rendering"
authors = [
    { name = "Patrick Golden", email = "ptgolden@email.unc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "curies>=0.15.3",
    "linkml>=1.12.1",
    "linkml-owl>=0.5.0",
    "linkml-runtime>=1.12.1",
    "pydantic>=2.14.1",
    "pyoxigraph>=0.5.11",
    "pyyaml>=6.0.3",
    "sssom-schema==1.0.0",
    "typer>=0.27.3",
]

[project.scripts]
mondo-source = "mondo_source.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
