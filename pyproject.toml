# Workspace: the shared mondo-source package, and one member per source. Each source
# directory is what would become its own repo, depending on a released mondo-source.
[tool.uv.workspace]
members = ["packages/*", "sources/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "sssom>=0.4.17",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["packages/mondo-source/src"]
