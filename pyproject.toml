[project]
name = "mondo-ingest-ordo"
version = "0.1.0"
description = "Experimental LinkML-first ingest of Orphanet (ORDO) for mondo-ingest"
readme = "README.md"
authors = [
    { name = "Patrick Golden", email = "ptgolden@email.unc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "linkml>=1.12.1",
]
