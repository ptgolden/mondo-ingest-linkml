id: https://w3id.org/monarch-initiative/mondo-source/experimental
name: mondo_source
title: Mondo source schema (experimental draft)
description: >-
  What Mondo takes in from one source: the source's in-scope terms, with Mondo's
  interpretation of them already applied (e.g. ORDO's part_of as parents, its
  synonyms as EXACT, synonyms generated from labels). The OWL and SSSOM files a
  source repo publishes are renderings of this.

  EXPERIMENT: in the target architecture this file lives only in mondo-ingest and
  source repos fetch it by PURL. It is here so the ORDO experiment is self-contained.

  Design rules:
  (1) Data Mondo's interpretation creates, as opposed to translates, says so: e.g.
  synonyms copied from labels carry synonym_type mondo:GENERATED_FROM_LABEL.
  (2) No overloaded fields. OBO's `xref` and `source` are split into a mapping
  predicate, a mapping justification and a comment.
  (3) Mappings are inlined on the term they are about, using the sssom-schema
  package's own slots, so the SSSOM file is a projection of this data, not a
  second source of truth.
version: 0.6.0
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mondo_source: https://w3id.org/monarch-initiative/mondo-source/
  dcterms: http://purl.org/dc/terms/
  oboInOwl: http://www.geneontology.org/formats/oboInOwl#
  owl: http://www.w3.org/2002/07/owl#
  pav: http://purl.org/pav/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  IAO: http://purl.obolibrary.org/obo/IAO_
  sssom: https://w3id.org/sssom/
  # rdf and skos are only used by the imported SSSOM schema's enums, but LinkML's
  # Python generator needs them declared here.
  skos: http://www.w3.org/2004/02/skos/core#
  # The SSSOM schema has no PURL for its YAML; this pins the release matching the
  # sssom-schema package version in pyproject.toml. Builds redirect this prefix to
  # the installed package with an importmap; tools without importmap support
  # (linkml-validate) fetch it from here.
  sssom_schema: https://raw.githubusercontent.com/mapping-commons/sssom/v1.0.0/src/sssom_schema/schema/

default_prefix: mondo_source
default_range: string

imports:
  - linkml:types
  - sssom_schema:sssom_schema

classes:

  SourceRelease:
    description: One release of one source.
    tree_root: true
    attributes:
      metadata:
        range: ReleaseMetadata
        required: true
        inlined: true
        annotations:
          owl.ignore: true
      terms:
        range: Term
        multivalued: true
        inlined_as_list: true
        required: true

  ReleaseMetadata:
    description: >-
      Freshness contract. mondo-ingest fails the build if schema_version does not match
      the schema it runs against, or if the release is older than it allows.
    attributes:
      source_id:
        description: Short identifier for the source, e.g. "ordo".
        required: true
      source_version:
        description: The version string the source itself publishes.
        slot_uri: pav:version
        required: true
      source_version_iri:
        range: uri
        slot_uri: owl:versionIRI
      source_date:
        description: >-
          The release/modification date the source itself publishes, verbatim.
          Not typed as datetime because sources publish dates without timezones
          (ORDO: "2026-06-26T16:36:02"), which are not valid RFC 3339 date-times.
        slot_uri: dcterms:modified
      source_license:
        range: uri
        slot_uri: dcterms:license
      source_download_url:
        description: The URL this release was actually built from.
        range: uri
        required: true
      schema_version:
        description: Version of this schema the release was validated against.
        required: true
      generated_at:
        range: datetime
        required: true
      generated_by:
        description: Pipeline identity, e.g. repo URL and commit.
        required: true

  Term:
    description: A class/concept in the source, identified by its CURIE in Mondo's prefix space.
    # OWL rendering (linkml-owl): each Term is an owl:Class. Each slot says how it is
    # rendered: an `owl` axiom type (using the slot_uri), or an `owl.template` in OWL
    # functional syntax for the structured ones.
    annotations:
      owl: Class
    attributes:
      id:
        identifier: true
        range: uriorcurie
        # A CURIE: prefix, colon, non-empty local part without whitespace. Declared
        # on each slot because gen-pydantic ignores patterns on types.
        pattern: &curie "^[A-Za-z_][A-Za-z0-9_.-]*:\\S+$"
      label:
        slot_uri: rdfs:label
        required: true
        annotations:
          owl: AnnotationAssertion
      definition:
        description: Textual definition.
        slot_uri: IAO:0000115
        annotations:
          owl: AnnotationAssertion
      synonyms:
        range: Synonym
        multivalued: true
        inlined_as_list: true
        annotations:
          owl.template: |-
            {% for s in synonyms %}
            AnnotationAssertion({% if s.synonym_type %}Annotation(oboInOwl:hasSynonymType {{ iri(s.synonym_type) }}) {% endif %}{{ iri(s.scope.meaning) }} {{ iri(id) }} "{{ s.text | replace('\\', '\\\\') | replace('"', '\\"') }}")
            {% if s.synonym_type %}SubAnnotationPropertyOf({{ iri(s.synonym_type) }} oboInOwl:SynonymTypeProperty){% endif %}
            {% endfor %}
      parents:
        description: >-
          Direct parents, as Mondo reads the source's hierarchy (for ORDO: its
          rdfs:subClassOf parents plus its part_of targets).
        range: Term
        inlined: false
        multivalued: true
        slot_uri: rdfs:subClassOf
        annotations:
          owl: SubClassOf
      relationships:
        description: Existential relations (subClassOf R some T), e.g. disease to gene.
        range: Relationship
        multivalued: true
        inlined_as_list: true
        annotations:
          owl.template: |-
            {% for r in relationships %}
            SubClassOf({{ iri(id) }} ObjectSomeValuesFrom({{ iri(r.predicate) }} {{ iri(r.target) }}))
            {% endfor %}
      deprecated:
        range: boolean
        slot_uri: owl:deprecated
        annotations:
          owl: AnnotationAssertion
      replaced_by:
        description: The single term the source says replaces this one.
        range: Term
        inlined: false
        slot_uri: IAO:0100001
        annotations:
          owl: AnnotationAssertion
      consider:
        description: Terms the source suggests instead, without claiming replacement.
        range: Term
        inlined: false
        multivalued: true
        slot_uri: oboInOwl:consider
        annotations:
          owl: AnnotationAssertion
      subsets:
        description: Subsets the term belongs to, e.g. mondo_vocab:ordo_disorder.
        range: uriorcurie
        pattern: *curie
        multivalued: true
        slot_uri: oboInOwl:inSubset
        annotations:
          owl.template: |-
            {% for s in subsets %}
            AnnotationAssertion(oboInOwl:inSubset {{ iri(id) }} {{ iri(s) }})
            {% endfor %}
      mappings:
        description: Every mapping the source asserts from this term.
        range: TermMapping
        multivalued: true
        inlined_as_list: true
        annotations:
          owl.template: |-
            {% for m in mappings %}
            AnnotationAssertion(Annotation(sssom:mapping_justification {{ iri(m.mapping_justification) }}){% if m.comment %} Annotation(rdfs:comment "{{ m.comment | replace('\\', '\\\\') | replace('"', '\\"') }}"){% endif %} {{ iri(m.predicate_id) }} {{ iri(id) }} {{ iri(m.object_id) }})
            {% endfor %}
  Synonym:
    attributes:
      text:
        required: true
      scope:
        range: SynonymScope
        required: true
      synonym_type:
        description: A synonym type CURIE (e.g. ABBREVIATION), if the source states one.
        range: uriorcurie
        pattern: *curie
        slot_uri: oboInOwl:hasSynonymType

  Relationship:
    attributes:
      predicate:
        range: uriorcurie
        pattern: *curie
        required: true
      target:
        range: uriorcurie
        pattern: *curie
        required: true

  TermMapping:
    description: >-
      An SSSOM mapping whose subject is the term it sits under. Uses the
      sssom-schema package's slots (so ranges, URIs and descriptions are SSSOM's)
      but not its `mapping` class, because that class's rules require subject_id,
      which here would only repeat the enclosing term's id. The SSSOM projection
      fills in subject_id and subject_label, and the projected file is validated
      as SSSOM.
    slots:
      # Every slot of sssom-schema 1.0.0's `mapping` class except subject_id and
      # subject_label.
      - subject_category
      - predicate_id
      - predicate_label
      - predicate_modifier
      - object_id
      - object_label
      - object_category
      - mapping_justification
      - author_id
      - author_label
      - reviewer_id
      - reviewer_label
      - creator_id
      - creator_label
      - license
      - subject_type
      - subject_source
      - subject_source_version
      - object_type
      - object_source
      - object_source_version
      - mapping_provider
      - mapping_source
      - mapping_cardinality
      - mapping_tool
      - mapping_tool_version
      - mapping_date
      - publication_date
      - confidence
      - curation_rule
      - curation_rule_text
      - subject_match_field
      - object_match_field
      - match_string
      - subject_preprocessing
      - object_preprocessing
      - similarity_score
      - similarity_measure
      - see_also
      - issue_tracker_item
      - other
      - comment
    slot_usage:
      # Required in SSSOM by a class rule, which TermMapping does not inherit.
      object_id:
        required: true
        pattern: *curie
      predicate_id:
        pattern: *curie

enums:
  SynonymScope:
    permissible_values:
      EXACT:
        meaning: oboInOwl:hasExactSynonym
      RELATED:
        meaning: oboInOwl:hasRelatedSynonym
      BROAD:
        meaning: oboInOwl:hasBroadSynonym
      NARROW:
        meaning: oboInOwl:hasNarrowSynonym
